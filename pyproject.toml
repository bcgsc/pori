[project]
name = "pori"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-refdocs (>=1.4.1,<2.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "mkdocs-include-markdown-plugin (>=7.3.0,<8.0.0)",
    "mkdocs-redirects (>=1.2.3,<2.0.0)",
    "mknotebooks (>=0.8.0,<0.9.0)",
    "pygments (>=2.20.0,<3.0.0)",
    "mkdocs-awesome-pages-plugin (>=2.10.1,<3.0.0)",
    "mkdocs-exclude (>=1.0.2,<2.0.0)",
    "markdown-include (>=0.8.1,<0.9.0)",
    "markdown-it-py (>=4.2.0,<5.0.0)",
    "properdocs (>=1.6.7,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
